# qa: configuration files are read from the service-configs Git repository, at the given branch
# or tag. To run this profile locally without a Git remote, set CONFIG_REPO_TYPE=native and
# CONFIG_REPO_LOCATION to a directory instead.
spring:
  cloud:
    config:
      server:
        composite:
          - type: vault
            host: ${VAULT_HOST}
            port: ${VAULT_PORT:8200}
            scheme: ${VAULT_SCHEME:http}
            backend: secret
            kv-version: 2
          - type: ${CONFIG_REPO_TYPE:git}
            uri: ${CONFIG_REPO_URI:}
            default-label: ${CONFIG_REPO_LABEL:main}
            search-locations: ${CONFIG_REPO_LOCATION:}

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL}
