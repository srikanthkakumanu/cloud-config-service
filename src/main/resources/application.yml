# Common to every environment. Where the configuration files come from is set per environment in
# application-dev.yml, application-qa.yml and application-prod.yml; with no profile set, dev is used.
spring:
  application:
    name: cloud-config-service
  lifecycle:
    # How long in-flight requests get to finish; the container is given longer than this.
    timeout-per-shutdown-phase: 30s
  profiles:
    default: dev
    # Every environment serves a composite of Vault and a file source.
    group:
      dev: composite
      qa: composite
      prod: composite
  cloud:
    config:
      server:
        # A caller that sends no X-Config-Token still gets the file-based configuration.
        fail-on-composite-error: false
        health:
          enabled: false

server:
  port: ${SERVER_PORT:9311}
  # On stop, finish the requests in flight instead of dropping them.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
